<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>เข้าสู่ระบบ | Quiz System</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" rel="stylesheet">
<link href="https://unpkg.com/aos@2.3.4/dist/aos.css" rel="stylesheet">
<link rel="manifest" href="manifest.json">
<style>
  :root { --primary:#2AA7A1; --secondary:#6BCB77; --warning:#FFD93D; --danger:#FF6B6B; --bg:#F4F6F9; }
  body { min-height:100vh; display:flex; align-items:center; justify-content:center;
    background: linear-gradient(135deg, var(--primary), var(--secondary)); font-family:'Segoe UI','Sarabun',sans-serif; }
  .glass-card { width:100%; max-width:420px; background:rgba(255,255,255,0.25); backdrop-filter:blur(16px);
    -webkit-backdrop-filter:blur(16px); border:1px solid rgba(255,255,255,0.35); border-radius:20px;
    padding:40px 32px; box-shadow:0 8px 32px rgba(0,0,0,0.15); color:#fff; }
  .glass-card h3 { font-weight:700; }
  .form-control { background:rgba(255,255,255,0.85); border:none; border-radius:12px; padding:12px 16px; }
  .form-control:focus { box-shadow:0 0 0 3px rgba(255,255,255,0.5); }
  .btn-login { background:#fff; color:var(--primary); font-weight:700; border-radius:12px; padding:12px; transition:.3s; }
  .btn-login:hover { background:var(--warning); color:#333; transform:translateY(-2px); }
  .link-white { color:#fff; text-decoration:underline; cursor:pointer; }
  .icon-circle { width:70px; height:70px; background:rgba(255,255,255,0.3); border-radius:50%;
    display:flex; align-items:center; justify-content:center; margin:0 auto 16px; font-size:28px; }
</style>
</head>
<body>
<div class="glass-card text-center" data-aos="zoom-in">
  <div class="icon-circle"><i class="fa-solid fa-graduation-cap"></i></div>
  <h3 class="mb-1">ระบบแบบทดสอบออนไลน์</h3>
  <p class="mb-4" style="opacity:.85">เข้าสู่ระบบเพื่อเริ่มต้นใช้งาน</p>
  <form id="loginForm" class="text-start">
    <div class="mb-3"><label class="form-label">ชื่อผู้ใช้</label>
      <input type="text" id="username" class="form-control" placeholder="กรอกชื่อผู้ใช้" required></div>
    <div class="mb-3"><label class="form-label">รหัสผ่าน</label>
      <input type="password" id="password" class="form-control" placeholder="กรอกรหัสผ่าน" required></div>
    <div class="form-check mb-3">
      <input class="form-check-input" type="checkbox" id="rememberMe" checked>
      <label class="form-check-label" for="rememberMe">จดจำการเข้าสู่ระบบ</label></div>
    <button type="submit" class="btn btn-login w-100 mb-3"><i class="fa-solid fa-right-to-bracket me-2"></i>เข้าสู่ระบบ</button>
    <div class="text-center"><span class="link-white" onclick="showForgotModal()">ลืมรหัสผ่าน?</span></div>
  </form>
</div>

<div class="modal fade" id="forgotModal" tabindex="-1">
  <div class="modal-dialog modal-dialog-centered">
    <div class="modal-content" style="border-radius:16px;">
      <div class="modal-header"><h5 class="modal-title">รีเซ็ตรหัสผ่าน</h5><button type="button" class="btn-close" data-bs-dismiss="modal"></button></div>
      <div class="modal-body">
        <p>กรอกอีเมลที่ลงทะเบียนไว้ ระบบจะส่งลิงก์รีเซ็ตรหัสผ่านให้ทางอีเมล</p>
        <input type="email" id="forgotEmail" class="form-control" placeholder="อีเมล">
      </div>
      <div class="modal-footer">
        <button class="btn btn-secondary" data-bs-dismiss="modal">ยกเลิก</button>
        <button class="btn" style="background:var(--primary); color:#fff;" onclick="submitForgotPassword()">ส่งลิงก์</button>
      </div>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
<script src="https://unpkg.com/aos@2.3.4/dist/aos.js"></script>
<script src="js/api.js"></script>
<script src="js/auth.js"></script>
<script>
AOS.init();
(async () => { const session = await checkSession(); if (session) redirectByRole(session.role); })();

document.getElementById('loginForm').addEventListener('submit', async (e) => {
  e.preventDefault();
  const username = document.getElementById('username').value.trim();
  const password = document.getElementById('password').value;
  Swal.fire({ title: 'กำลังเข้าสู่ระบบ...', didOpen: () => Swal.showLoading(), allowOutsideClick: false });
  try {
    const session = await doLogin(username, password);
    Swal.fire({ icon:'success', title:'เข้าสู่ระบบสำเร็จ', text:`ยินดีต้อนรับ ${session.fullName}`, timer:1500, showConfirmButton:false });
    setTimeout(() => redirectByRole(session.role), 1500);
  } catch (err) { Swal.fire('เข้าสู่ระบบไม่สำเร็จ', err.message, 'error'); }
});

function showForgotModal() { new bootstrap.Modal(document.getElementById('forgotModal')).show(); }

async function submitForgotPassword() {
  const email = document.getElementById('forgotEmail').value.trim();
  if (!email) return Swal.fire('แจ้งเตือน', 'กรุณากรอกอีเมล', 'warning');
  try {
    const result = await doForgotPassword(email);
    bootstrap.Modal.getInstance(document.getElementById('forgotModal')).hide();
    Swal.fire('สำเร็จ', result.message, 'success');
  } catch (err) { Swal.fire('เกิดข้อผิดพลาด', err.message, 'error'); }
}
if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js');
</script>
</body>
</html>
