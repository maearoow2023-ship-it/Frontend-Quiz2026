<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>เกียรติบัตรของฉัน | Quiz System</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" rel="stylesheet">
<link href="css/style.css" rel="stylesheet">
<link rel="manifest" href="manifest.json">
</head>
<body>
<nav class="navbar navbar-glass px-3 px-md-4"><a href="dashboard.html" class="navbar-brand fw-bold" style="color:var(--primary)"><i class="fa-solid fa-arrow-left me-2"></i>กลับหน้าหลัก</a></nav>
<div class="container py-4">
  <h4 class="mb-4"><i class="fa-solid fa-certificate me-2"></i>เกียรติบัตรของฉัน</h4>
  <div id="certList" class="row g-3"></div>
</div>
<script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
<script src="api.js"></script>
<script src="auth.js"></script>
<script>
document.addEventListener('DOMContentLoaded', async () => {
  const session = await requireAuth(['Student','Teacher','Admin']);
  if (!session) return;
  Swal.fire({ title: 'กำลังโหลด...', didOpen: () => Swal.showLoading(), allowOutsideClick: false });
  try {
    const certs = await apiGet({ action: 'myCertificates', token: session.token });
    document.getElementById('certList').innerHTML = certs.length ? certs.map(c => `
      <div class="col-md-4">
        <div class="glass-card p-3 text-center">
          <i class="fa-solid fa-award" style="font-size:48px; color:var(--warning)"></i>
          <h6 class="mt-2 mb-1">${c.certificateName}</h6>
          <p class="small text-muted mb-2">รหัส: ${c.certificateId}</p>
          <img src="${c.qrCode}" width="80" class="mb-2"><br>
          <a href="${c.fileUrl}" target="_blank" class="btn btn-sm btn-primary-custom"><i class="fa-solid fa-download me-1"></i>ดาวน์โหลด PDF</a>
        </div>
      </div>`).join('') : '<p class="text-muted text-center">ยังไม่มีเกียรติบัตร ทำแบบทดสอบให้ผ่านเกณฑ์เพื่อรับเกียรติบัตรกันเถอะ!</p>';
    Swal.close();
  } catch (err) { Swal.fire('เกิดข้อผิดพลาด', err.message, 'error'); }
});
if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js');
</script>
</body>
</html>
