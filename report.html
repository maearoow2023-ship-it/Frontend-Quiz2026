<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ระบบรายงาน | Quiz System</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" rel="stylesheet">
<link href="css/style.css" rel="stylesheet">
</head>
<body>
<nav class="navbar navbar-glass px-3 px-md-4"><a href="dashboard.html" class="navbar-brand fw-bold" style="color:var(--primary)"><i class="fa-solid fa-arrow-left me-2"></i>กลับหน้าหลัก</a></nav>
<div class="container py-4">
  <h4 class="mb-4"><i class="fa-solid fa-chart-column me-2"></i>ระบบรายงานและวิเคราะห์ข้อสอบ</h4>
  <div class="glass-card p-3 mb-4">
    <div class="row g-2">
      <div class="col-md-8"><select id="quizSelect" class="form-select" onchange="loadReport()"></select></div>
      <div class="col-md-4 d-flex gap-2">
        <button class="btn btn-primary-custom flex-fill" onclick="exportCSV()"><i class="fa-solid fa-file-csv me-1"></i>Export CSV</button>
        <button class="btn btn-secondary-custom flex-fill" onclick="window.print()"><i class="fa-solid fa-print me-1"></i>Print</button>
      </div>
    </div>
  </div>
  <ul class="nav nav-pills mb-3" id="reportTabs">
    <li class="nav-item"><button class="nav-link active" onclick="switchTab('byStudent')">รายคน</button></li>
    <li class="nav-item"><button class="nav-link" onclick="switchTab('byQuestion')">รายข้อ</button></li>
    <li class="nav-item"><button class="nav-link" onclick="switchTab('analysis')">วิเคราะห์ข้อสอบ</button></li>
    <li class="nav-item"><button class="nav-link" onclick="switchTab('certificate')">เกียรติบัตร</button></li>
  </ul>
  <div class="row g-3 mb-3" id="summaryCards"></div>
  <div id="tabByStudent" class="report-tab"></div>
  <div id="tabByQuestion" class="report-tab d-none"></div>
  <div id="tabAnalysis" class="report-tab d-none"></div>
  <div id="tabCertificate" class="report-tab d-none"></div>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
<script src="js/api.js"></script>
<script src="js/auth.js"></script>
<script src="js/report.js"></script>
</body>
</html>
