<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>จัดการแบบทดสอบ | Quiz System</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" rel="stylesheet">
<link href="css/style.css" rel="stylesheet">
<link rel="manifest" href="manifest.json">
</head>
<body>
<nav class="navbar navbar-glass px-3 px-md-4">
  <a href="dashboard.html" class="navbar-brand fw-bold" style="color:var(--primary)"><i class="fa-solid fa-graduation-cap me-2"></i>Quiz System</a>
  <button class="btn btn-danger-custom" onclick="doLogout()"><i class="fa-solid fa-right-from-bracket"></i></button>
</nav>
<div class="container py-4">
  <div class="d-flex flex-wrap justify-content-between align-items-center mb-4 gap-2">
    <h4 class="mb-0"><i class="fa-solid fa-file-pen me-2"></i>จัดการแบบทดสอบ</h4>
    <button class="btn btn-primary-custom" onclick="openQuizModal()"><i class="fa-solid fa-plus me-1"></i>สร้างแบบทดสอบใหม่</button>
  </div>
  <div class="glass-card p-3 mb-3"><input type="text" id="searchInput" class="form-control" placeholder=" ค้นหาชื่อแบบทดสอบ..." onkeyup="filterQuizTable()"></div>
  <div class="glass-card p-3">
    <div class="table-responsive">
      <table class="table align-middle" id="quizTable">
        <thead><tr><th>ชื่อแบบทดสอบ</th><th>วิชา</th><th>ประเภท</th><th>จำนวนข้อ</th><th>คะแนนเต็ม</th><th>เวลา (นาที)</th><th>สถานะ</th><th>จัดการ</th></tr></thead>
        <tbody id="quizTableBody"></tbody>
      </table>
    </div>
  </div>
</div>

<div class="modal fade" id="quizModal" tabindex="-1">
  <div class="modal-dialog modal-lg">
    <div class="modal-content" style="border-radius:16px;">
      <div class="modal-header"><h5 class="modal-title" id="quizModalTitle">สร้างแบบทดสอบใหม่</h5><button class="btn-close" data-bs-dismiss="modal"></button></div>
      <div class="modal-body">
        <input type="hidden" id="quizId">
        <div class="row g-3">
          <div class="col-md-8"><label class="form-label">ชื่อแบบทดสอบ</label><input type="text" id="quizTitle" class="form-control" placeholder="เช่น แบบทดสอบบทที่ 1"></div>
          <div class="col-md-4"><label class="form-label">ประเภท</label>
            <select id="quizType" class="form-select">
              <option value="Quiz">Quiz</option><option value="PreTest">Pre-Test</option><option value="PostTest">Post-Test</option>
              <option value="Exam">Exam</option><option value="Practice">Practice</option><option value="Assignment">Assignment</option>
            </select></div>
          <div class="col-md-6"><label class="form-label">วิชา</label>
            <div class="d-flex gap-2"><select id="quizSubject" class="form-select"></select>
            <button class="btn btn-secondary-custom" type="button" onclick="quickAddSubject()"><i class="fa-solid fa-plus"></i></button></div></div>
          <div class="col-md-3"><label class="form-label">เวลาทำ (นาที)</label><input type="number" id="quizTimeLimit" class="form-control" value="0" min="0"></div>
          <div class="col-md-3"><label class="form-label">คะแนนผ่าน (%)</label><input type="number" id="quizPassScore" class="form-control" value="50" min="0" max="100"></div>
          <div class="col-md-6"><label class="form-label">วันเปิด</label><input type="datetime-local" id="quizOpenDate" class="form-control"></div>
          <div class="col-md-6"><label class="form-label">วันปิด</label><input type="datetime-local" id="quizCloseDate" class="form-control"></div>
          <div class="col-md-4"><label class="form-label">จำนวนครั้งที่ทำได้</label><input type="number" id="quizMaxAttempts" class="form-control" value="1" min="1"></div>
          <div class="col-md-4"><label class="form-label">เฉลย</label>
            <select id="quizShowAnswer" class="form-select">
              <option value="Immediate">แสดงทันทีหลังตอบ</option><option value="AfterSubmit">แสดงหลังส่งข้อสอบ</option><option value="Never">ไม่แสดงเฉลย</option>
            </select></div>
          <div class="col-md-4"><label class="form-label">สถานะ</label>
            <select id="quizStatus" class="form-select"><option value="Draft">ฉบับร่าง</option><option value="Active">เปิดใช้งาน</option><option value="Closed">ปิดใช้งาน</option></select></div>
          <div class="col-md-6 form-check ms-2"><input type="checkbox" class="form-check-input" id="quizRandomQuestion"><label class="form-check-label" for="quizRandomQuestion">สุ่มลำดับข้อสอบ</label></div>
          <div class="col-md-6 form-check ms-2"><input type="checkbox" class="form-check-input" id="quizRandomChoice"><label class="form-check-label" for="quizRandomChoice">สุ่มลำดับตัวเลือก</label></div>
        </div>
      </div>
      <div class="modal-footer"><button class="btn btn-secondary" data-bs-dismiss="modal">ยกเลิก</button><button class="btn btn-primary-custom" onclick="submitQuiz()">บันทึก</button></div>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
<script src="api.js"></script>
<script src="auth.js"></script>
<script src="quiz-manage.js"></script>
</body>
</html>
