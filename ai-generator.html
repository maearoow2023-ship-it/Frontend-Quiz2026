<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AI สร้างข้อสอบ | Quiz System</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" rel="stylesheet">
<link href="css/style.css" rel="stylesheet">
</head>
<body>
<nav class="navbar navbar-glass px-3 px-md-4"><a href="quiz-manage.html" class="navbar-brand fw-bold" style="color:var(--primary)"><i class="fa-solid fa-arrow-left me-2"></i>กลับ</a></nav>
<div class="container py-4">
  <h4 class="mb-4"><i class="fa-solid fa-robot me-2"></i>AI ผู้ช่วยสร้างข้อสอบ</h4>
  <div class="glass-card p-4 mb-4">
    <div class="row g-3">
      <div class="col-md-6"><label class="form-label">หัวข้อ/เนื้อหา</label><input type="text" id="aiTopic" class="form-control" placeholder="เช่น การสังเคราะห์แสงของพืช"></div>
      <div class="col-md-3"><label class="form-label">ประเภทข้อสอบ</label>
        <select id="aiType" class="form-select">
          <option value="MultipleChoice">ปรนัย 4 ตัวเลือก</option><option value="TrueFalse">ถูก/ผิด</option>
          <option value="FillBlank">เติมคำ</option><option value="MultipleSelect">เลือกหลายคำตอบ</option>
        </select></div>
      <div class="col-md-3"><label class="form-label">จำนวนข้อ</label><input type="number" id="aiAmount" class="form-control" value="5" min="1" max="20"></div>
      <div class="col-md-4"><label class="form-label">ระดับความยาก</label>
        <select id="aiDifficulty" class="form-select"><option value="ง่าย">ง่าย</option><option value="ปานกลาง" selected>ปานกลาง</option><option value="ยาก">ยาก</option></select></div>
      <div class="col-md-4 d-flex align-items-end"><button class="btn btn-primary-custom w-100" onclick="generateQuestions()"><i class="fa-solid fa-wand-magic-sparkles me-1"></i>สร้างข้อสอบด้วย AI</button></div>
    </div>
  </div>
  <div id="aiResultList"></div>
  <div id="saveBar" class="glass-card p-3 d-none">
    <div class="d-flex justify-content-between align-items-center">
      <span>เลือกแบบทดสอบที่ต้องการเพิ่มคำถามเหล่านี้เข้าไป</span>
      <div class="d-flex gap-2"><select id="targetQuiz" class="form-select"></select><button class="btn btn-secondary-custom" onclick="saveAllQuestions()"><i class="fa-solid fa-floppy-disk me-1"></i>บันทึกทั้งหมด</button></div>
    </div>
  </div>
</div>
<script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
<script src="api.js"></script>
<script src="auth.js"></script>
<script src="ai-generator.js"></script>
</body>
</html>
