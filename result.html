<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ผลการทำแบบทดสอบ | Quiz System</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" rel="stylesheet">
<link href="css/style.css" rel="stylesheet">
<style>
  .grade-circle { width:120px; height:120px; border-radius:50%; display:flex; align-items:center; justify-content:center; font-size:2.5rem; font-weight:800; margin:0 auto; color:#fff; }
  .review-item { border-left:4px solid #ccc; }
  .review-correct { border-left-color: var(--secondary); }
  .review-wrong { border-left-color: var(--danger); }
</style>
</head>
<body>
<nav class="navbar navbar-glass px-3 px-md-4"><a href="dashboard.html" class="navbar-brand fw-bold" style="color:var(--primary)"><i class="fa-solid fa-house me-2"></i>กลับหน้าหลัก</a></nav>
<div class="container py-4">
  <div class="glass-card p-4 text-center mb-4">
    <h4 id="resultQuizTitle" class="mb-3">-</h4>
    <div id="gradeCircle" class="grade-circle mb-3">-</div>
    <h5 id="passStatusText">-</h5>
    <div class="row mt-4 g-3">
      <div class="col-6 col-md-3"><div class="glass-card stat-card"><h3 id="resultScore">-</h3><p>คะแนนที่ได้</p></div></div>
      <div class="col-6 col-md-3"><div class="glass-card stat-card"><h3 id="resultPercentage">-</h3><p>เปอร์เซ็นต์</p></div></div>
      <div class="col-6 col-md-3"><div class="glass-card stat-card"><h3 id="resultRanking">-</h3><p>อันดับ</p></div></div>
      <div class="col-6 col-md-3"><div class="glass-card stat-card"><h3 id="resultTime">-</h3><p>เวลาที่ใช้</p></div></div>
    </div>
  </div>
  <div id="reviewSection"></div>
</div>
<script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
<script src="js/api.js"></script>
<script src="js/auth.js"></script>
<script src="js/result.js"></script>
</body>
</html>
