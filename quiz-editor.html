<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>จัดการคำถาม | Quiz System</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" rel="stylesheet">
<link href="css/style.css" rel="stylesheet">
<style>
  .choice-row { display:flex; align-items:center; gap:8px; margin-bottom:8px; }
  .choice-row input[type="text"] { flex:1; }
  .type-badge { font-size:0.75rem; }
  .question-card { border-left:4px solid var(--primary); }
</style>
</head>
<body>
<nav class="navbar navbar-glass px-3 px-md-4">
  <a href="quiz-manage.html" class="navbar-brand fw-bold" style="color:var(--primary)"><i class="fa-solid fa-arrow-left me-2"></i>กลับไปรายการแบบทดสอบ</a>
  <button class="btn btn-danger-custom" onclick="doLogout()"><i class="fa-solid fa-right-from-bracket"></i></button>
</nav>
<div class="container py-4">
  <div class="glass-card p-3 mb-4">
    <h5 id="quizTitleHeader" class="mb-1">กำลังโหลด...</h5>
    <small class="text-muted">จำนวนข้อ: <span id="totalQuestions">0</span> | คะแนนเต็ม: <span id="totalScore">0</span></small>
  </div>
  <div class="d-flex justify-content-between align-items-center mb-3">
    <h6 class="mb-0">รายการคำถาม</h6>
    <button class="btn btn-primary-custom" onclick="openQuestionModal()"><i class="fa-solid fa-plus me-1"></i>เพิ่มคำถาม</button>
  </div>
  <div id="questionList"></div>
</div>

<div class="modal fade" id="questionModal" tabindex="-1">
  <div class="modal-dialog modal-lg modal-dialog-scrollable">
    <div class="modal-content" style="border-radius:16px;">
      <div class="modal-header"><h5 class="modal-title" id="questionModalTitle">เพิ่มคำถาม</h5><button class="btn-close" data-bs-dismiss="modal"></button></div>
      <div class="modal-body">
        <input type="hidden" id="questionId">
        <div class="mb-3"><label class="form-label">ประเภทข้อสอบ</label>
          <select id="questionType" class="form-select" onchange="renderChoiceBuilder()">
            <option value="MultipleChoice">ปรนัย 4 ตัวเลือก</option>
            <option value="TrueFalse">ถูก / ผิด</option>
            <option value="FillBlank">เติมคำในช่องว่าง</option>
            <option value="MultipleSelect">เลือกหลายคำตอบ (ถูก ≥ 2 ข้อ)</option>
          </select></div>
        <div class="mb-3"><label class="form-label">คำถาม</label><textarea id="questionText" class="form-control" rows="3" placeholder="พิมพ์คำถามที่นี่..."></textarea></div>
        <div class="row g-3 mb-3">
          <div class="col-md-6"><label class="form-label">คะแนนของข้อนี้</label><input type="number" id="questionScore" class="form-control" value="1" min="1"></div>
          <div class="col-md-6"><label class="form-label">ระดับความยาก</label>
            <select id="questionDifficulty" class="form-select"><option value="Easy">ง่าย</option><option value="Medium" selected>ปานกลาง</option><option value="Hard">ยาก</option></select></div>
        </div>
        <div id="choiceBuilder" class="glass-card p-3 mb-3"></div>
        <div class="mb-3"><label class="form-label">คำอธิบายเฉลย (แสดงหลังทำข้อสอบ)</label><textarea id="questionExplanation" class="form-control" rows="2" placeholder="อธิบายว่าทำไมคำตอบนี้ถึงถูกต้อง..."></textarea></div>
      </div>
      <div class="modal-footer"><button class="btn btn-secondary" data-bs-dismiss="modal">ยกเลิก</button><button class="btn btn-primary-custom" onclick="submitQuestion()">บันทึกคำถาม</button></div>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
<script src="js/api.js"></script>
<script src="js/auth.js"></script>
<script src="js/quiz-editor.js"></script>
</body>
</html>
