<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ตั้งรหัสผ่านใหม่ | Quiz System</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<style>
  body { min-height:100vh; display:flex; align-items:center; justify-content:center;
    background: linear-gradient(135deg,#2AA7A1,#6BCB77); font-family:'Segoe UI','Sarabun',sans-serif; }
  .card-box { width:100%; max-width:420px; background:rgba(255,255,255,.9); border-radius:20px; padding:36px; box-shadow:0 8px 32px rgba(0,0,0,.15); }
</style>
</head>
<body>
<div class="card-box">
  <h4 class="mb-3 text-center">ตั้งรหัสผ่านใหม่</h4>
  <input type="password" id="newPassword" class="form-control mb-3" placeholder="รหัสผ่านใหม่ (อย่างน้อย 6 ตัวอักษร)">
  <input type="password" id="confirmPassword" class="form-control mb-3" placeholder="ยืนยันรหัสผ่านใหม่">
  <button class="btn w-100 text-white" style="background:#2AA7A1;" onclick="submitReset()">บันทึกรหัสผ่านใหม่</button>
</div>
<script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
<script src="api.js"></script>
<script src="auth.js"></script>
<script>
const params = new URLSearchParams(window.location.search);
const token = params.get('token');
async function submitReset() {
  const p1 = document.getElementById('newPassword').value;
  const p2 = document.getElementById('confirmPassword').value;
  if (!token) return Swal.fire('ผิดพลาด', 'ลิงก์ไม่ถูกต้อง', 'error');
  if (p1 !== p2) return Swal.fire('ผิดพลาด', 'รหัสผ่านไม่ตรงกัน', 'error');
  try {
    const res = await doResetPassword(token, p1);
    Swal.fire('สำเร็จ', res.message, 'success').then(() => window.location.href = 'login.html');
  } catch (err) { Swal.fire('ผิดพลาด', err.message, 'error'); }
}
</script>
</body>
</html>
