<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>กระดานผู้นำ | Quiz System</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" rel="stylesheet">
<link href="css/style.css" rel="stylesheet">
<style>
  .rank-1 { background: linear-gradient(135deg,#FFD93D,#FFB800); }
  .rank-2 { background: linear-gradient(135deg,#C0C0C0,#A0A0A0); }
  .rank-3 { background: linear-gradient(135deg,#CD7F32,#B8672A); }
  .rank-badge { width:40px; height:40px; border-radius:50%; display:flex; align-items:center; justify-content:center; font-weight:800; color:#fff; }
</style>
</head>
<body>
<nav class="navbar navbar-glass px-3 px-md-4"><a href="dashboard.html" class="navbar-brand fw-bold" style="color:var(--primary)"><i class="fa-solid fa-arrow-left me-2"></i>กลับหน้าหลัก</a></nav>
<div class="container py-4">
  <h4 class="mb-4"><i class="fa-solid fa-ranking-star me-2"></i>กระดานผู้นำคะแนนสูงสุด</h4>
  <div id="leaderboardList" class="glass-card p-3"></div>
</div>
<script src="js/api.js"></script>
<script src="js/auth.js"></script>
<script>
document.addEventListener('DOMContentLoaded', async () => {
  const session = await requireAuth(['Admin','Teacher','Student']);
  if (!session) return;
  const data = await apiGet({ action: 'leaderboard', limit: 20 });
  document.getElementById('leaderboardList').innerHTML = data.map(r => `
    <div class="d-flex align-items-center justify-content-between p-2 mb-2 rounded" style="background:rgba(0,0,0,0.03);">
      <div class="d-flex align-items-center gap-3">
        <div class="rank-badge ${r.rank<=3?'rank-'+r.rank:''}" style="${r.rank>3?'background:#999;':''}">${r.rank}</div>
        <img src="${r.profileImage || 'assets/img/default-avatar.png'}" width="40" height="40" class="rounded-circle">
        <div><strong>${r.fullName}</strong><br><small class="text-muted">Lv.${r.level} · ${r.quizCount} แบบทดสอบ</small></div>
      </div>
      <h5 class="mb-0" style="color:var(--primary)">${r.totalScore} คะแนน</h5>
    </div>`).join('');
});
</script>
</body>
</html>
