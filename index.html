<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Quiz System</title>
<link rel="manifest" href="manifest.json">
<style>
  body { margin:0; min-height:100vh; display:flex; align-items:center; justify-content:center;
    background: linear-gradient(135deg,#2AA7A1,#6BCB77); font-family:'Segoe UI','Sarabun',sans-serif; color:#fff; }
  .loader { text-align:center; }
  .spinner { width:50px; height:50px; border:5px solid rgba(255,255,255,0.3); border-top-color:#fff; border-radius:50%; animation: spin 1s linear infinite; margin: 0 auto 16px; }
  @keyframes spin { to { transform: rotate(360deg); } }
</style>
</head>
<body>
<div class="loader">
  <div class="spinner"></div>
  <h4>กำลังโหลดระบบแบบทดสอบออนไลน์...</h4>
</div>
<script src="js/api.js"></script>
<script src="js/auth.js"></script>
<script>
(async () => {
  const session = await checkSession();
  setTimeout(() => {
    if (session) redirectByRole(session.role);
    else window.location.href = 'login.html';
  }, 600);
})();
if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js');
</script>
</body>
</html>
